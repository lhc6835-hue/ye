# Builds both games and publishes them to GitHub Pages (Catchute at the root, Glass Fruit under /glass/).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/tender-goldberg-xoww3e]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # the glass fruit game lives in its own folder and is served under /glass/
      - run: npm ci && npm run build && cp -r dist ../dist/glass
        working-directory: glass
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
