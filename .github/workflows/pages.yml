# Publishes the arcade hub to GitHub Pages. It is a static site, so there is no build step:
# every push to the default branch (including commits made from admin.html) redeploys it.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/tender-goldberg-xoww3e]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
